services:
  # 前端服务
  fretboard-diagram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fretboard-diagram
    ports:
      - "1645:80"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - fretboard-network

  # 认证/同步服务（Node + SQLite；/api 全走这里，nginx 反代）
  # 数据库文件挂 ./server-data 到容器 /data；备份 = 拷走该目录
  auth:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fretboard-auth
    restart: unless-stopped
    volumes:
      - ./server-data:/data
    environment:
      - FRETB_DB=/data/data.db
      - FRETB_HOST=0.0.0.0
      - PORT=8787
    expose:
      - "8787"
    networks:
      - fretboard-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fretboard-backend
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=fretboard_db
      - CORS_ORIGINS=*
    networks:
      - fretboard-network

  # MongoDB 数据库
  mongodb:
    image: mongo:7.0
    container_name: fretboard-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - fretboard-network

  # 开发环境服务（可选）
  fretboard-diagram-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fretboard-diagram-dev
    ports:
      - "5173:5173"
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./package.json:/app/package.json
    environment:
      - NODE_ENV=development
    profiles:
      - dev

volumes:
  mongodb_data:
    driver: local

networks:
  fretboard-network:
    driver: bridge
